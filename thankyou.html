<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Submitted — Octomaids</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e6ef;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #059669;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.7;
    }

    .divider {
      height: 1px;
      background: #e2e6ef;
      margin: 24px 0;
    }

    .note {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Invoice Submitted!</h1>
    <p>Your invoice has been received successfully. A confirmation copy has been sent to your email address.</p>
    <div class="divider"></div>
    <p class="note">You may now close this page. Thank you for submitting your Octomaids invoice.</p>
  </div>
</body>
</html>
